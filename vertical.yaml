# Brand/domain config for the "hmu" vertical (HMU Link).
# Fase 1.2 adds `styles.catalog` (which of the engine's closed brand styles
# this vertical may use) and `strings_overrides` (per-language UI string
# overrides layered on top of the engine's base STRINGS). Fase 1.3 adds
# `blocks` (conditional-block overrides). HMU uses the full catalog, no
# string overrides and the engine's default blocks, so output stays
# byte-identical to golden.
# Fase 1.4 extends this file further with full schema validation.
id: hmu
brand_name: "HMU Link"
domain: "https://www.hmulink.com"

styles:
  catalog:
    - black-gold
    - soft-blush
    - charcoal-clean
    - warm-sand
    - aqua-clean
    - sage-calm
    - electric-slate
    - terracotta-warm
    - sunny-paws
    - midnight-ink
    - clarity-editorial
    - horizon-teal

# Per-language UI string overrides layered on the engine's base STRINGS
# (engine/generator/strings_base.py). Empty for HMU: it uses the base
# strings as-is. A future vertical can override individual keys here, e.g.:
#   strings_overrides:
#     es:
#       btn_booking: "Agendar cita"
strings_overrides:
  es: {}
  en: {}

# Conditional-block overrides layered on the engine registry
# (engine/generator/blocks.py, ENGINE_BLOCKS). Each block gates on the
# payload's `business_type` via `enabled_for`:
#   - list of business types -> renders for those types (payloads without
#     business_type, or "general", always keep the block)
#   - "all"  -> renders for every business type
#   - "none" -> the vertical never renders the block
# HMU uses the engine defaults as-is:
#   delivery_pickup: food, retail
#   portfolio: creative, beauty, wellness, professional, fitness
#   lookbook: all (Fase 3.2, ported from ModaLink — data-driven via
#     lookbook_urls, so it renders nothing unless a payload sets it)
# A future vertical can tune them, e.g.:
#   blocks:
#     delivery_pickup:
#       enabled_for: none
#     portfolio:
#       enabled_for: all
blocks:
  # ACTIVACION del vCard (linkFactory/22, decision de Vero charly/34). El
  # bloque se construyo en linkFactory/14 y quedo apagado por default; sin esta
  # linea el boton "Guardar en contactos" no existe en una sola pagina. Va en
  # "all" porque el valor —el cliente recurrente que olvido el enlace— no
  # depende del giro. Solo alcanza a lo que se GENERE desde hoy: las paginas ya
  # publicadas no se regeneran (decision de Vero, la regeneracion es P5).
  vcard:
    enabled_for: all
  # ACTIVACION del pase de Google Wallet (linkFactory/18, decision 2a de Vero
  # charly/34). Se enciende HOY y no antes porque hasta hoy el pase salia
  # marcado [TEST ONLY] y solo lo podian guardar las cuentas de prueba: un
  # cliente real tocaba el boton y no le pasaba NADA. El 2026-07-30 llego la
  # aprobacion del Issuer "Bridge Company" y esa puerta se abrio.
  #
  # Va en "all" por la misma razon que el vCard: el valor —el cliente que
  # vuelve cada tres meses y ya no encuentra el enlace— no depende del giro. El
  # .vcf guarda el contacto en la agenda; el pase guarda la PAGINA en la app que
  # la gente si vuelve a abrir. Son complementarios, no alternativos.
  #
  # Encender esto no basta para que salga el boton: hace falta ademas que el
  # entorno que corre el generador traiga las credenciales del Issuer (variable
  # GOOGLE_WALLET_ISSUER_ID + secreto GOOGLE_WALLET_SERVICE_ACCOUNT_JSON). Sin
  # ellas la pagina se genera igual, sin boton y con un aviso por stderr — la
  # pagina es el producto, el pase es el extra.
  #
  # Alcance: solo lo que se GENERE desde hoy. Las paginas ya publicadas no se
  # regeneran (decision de Vero, la regeneracion es P5).
  wallet_google:
    enabled_for: all

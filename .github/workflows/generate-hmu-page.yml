name: Generate HMU Service Menu Page

# Triggered by service-menu-worker via repository_dispatch after it validates
# a paid order + Tally intake. The full sanitized public payload arrives in
# client_payload (the workflow never reads KV, Tally or Stripe).
#
# The same event also carries corrections (client_payload.is_correction=true,
# dispatched by the worker's POST /correct): apply_correction.py edits the
# existing data/clients/<slug>.client.json via gpt-4o-mini and regenerates the
# page; on any problem it reports correction_status=manual and touches nothing.

on:
  repository_dispatch:
    types: [new-hmu-service-menu]

concurrency:
  group: generate-hmu-page
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  # Necesario para disparar el workflow de pages: los push hechos con el
  # GITHUB_TOKEN por defecto no disparan otros workflows (anti-recursión),
  # así que el deploy se lanza explícitamente vía workflow_dispatch.
  actions: write
  pages: write
  id-token: write

jobs:
  generate:
    outputs:
      commit_sha: ${{ steps.revision.outputs.sha }}
      slug: ${{ steps.build.outputs.slug || steps.correct.outputs.slug }}
      correction_status: ${{ steps.correct.outputs.correction_status }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build client page from intake
        id: build
        if: ${{ github.event.client_payload.is_correction != true }}
        env:
          INTAKE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generator/build_client_from_intake.py

      - name: Apply correction to existing page
        id: correct
        if: ${{ github.event.client_payload.is_correction == true }}
        env:
          CORRECTION_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generator/apply_correction.py

      - name: Commit and push generated page
        env:
          SLUG: ${{ steps.build.outputs.slug || steps.correct.outputs.slug }}
          IS_CORRECTION: ${{ github.event.client_payload.is_correction == true }}
        run: |
          git config user.name "hmu-link-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/clients/ public/links/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if [ "$IS_CORRECTION" = "true" ]; then
            git commit -m "fix: apply correction to HMU Link page $SLUG"
          else
            git commit -m "feat: publish HMU Link page $SLUG"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record generated revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: generate
    uses: ./.github/workflows/pages.yml
    with:
      build_ref: ${{ needs.generate.outputs.commit_sha }}
    secrets: inherit

  notify:
    needs: [generate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.generate.outputs.commit_sha }}
      - name: Notify only after Pages succeeds
        env:
          WORKER_URL: ${{ secrets.SERVICE_MENU_WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          SLUG: ${{ needs.generate.outputs.slug }}
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          CORRECTION_ID: ${{ github.event.client_payload.correction_id }}
          CORRECTION_STATUS: ${{ needs.generate.outputs.correction_status }}
          GENERATION_ATTEMPT: ${{ github.event.client_payload.generation_attempt || 0 }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL" && test -n "$NOTIFY_SECRET"
          if [ -n "$CORRECTION_ID" ]; then
            payload=$(jq -nc --arg slug "$SLUG" --arg cid "$CORRECTION_ID" \
              --arg st "${CORRECTION_STATUS:-manual}" --argjson attempt "$GENERATION_ATTEMPT" \
              '{slug:$slug,correction_id:$cid,correction_status:$st,generation_attempt:$attempt}')
          else
            qr=""
            if [ -f "public/links/$SLUG/qr.png" ]; then qr=$(base64 -w0 "public/links/$SLUG/qr.png"); fi
            payload=$(jq -nc --arg slug "$SLUG" --arg sid "$SUBMISSION_ID" --arg qr "$qr" \
              --argjson attempt "$GENERATION_ATTEMPT" \
              '{slug:$slug,submission_id:$sid,qr_png_base64:$qr,generation_attempt:$attempt}')
          fi
          curl --fail-with-body --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 -sS \
            -X POST "$WORKER_URL/notify" -H "Authorization: Bearer $NOTIFY_SECRET" \
            -H "Content-Type: application/json" -d "$payload"

  alert:
    needs: [generate, deploy, notify]
    if: ${{ always() && (needs.generate.result == 'failure' || needs.deploy.result == 'failure' || needs.notify.result == 'failure' || needs.generate.result == 'cancelled' || needs.deploy.result == 'cancelled' || needs.notify.result == 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failure without consuming a free change
        env:
          WORKER_URL: ${{ secrets.SERVICE_MENU_WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          SLUG: ${{ github.event.client_payload.slug }}
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          CORRECTION_ID: ${{ github.event.client_payload.correction_id }}
          GENERATION_ATTEMPT: ${{ github.event.client_payload.generation_attempt || 0 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_STAGE: ${{ needs.generate.result != 'success' && 'generation' || needs.deploy.result != 'success' && 'deployment' || 'notification' }}
          PUBLICATION_CONFIRMED: ${{ needs.deploy.result == 'success' }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL" && test -n "$NOTIFY_SECRET"
          payload=$(jq -nc --arg slug "$SLUG" --arg sid "$SUBMISSION_ID" --arg cid "$CORRECTION_ID" \
            --arg run "$RUN_URL" --argjson attempt "$GENERATION_ATTEMPT" \
            --arg stage "$FAILURE_STAGE" --argjson published "$PUBLICATION_CONFIRMED" \
            '{slug:$slug,submission_id:$sid,correction_id:$cid,run_url:$run,generation_attempt:$attempt,failure_stage:$stage,publication_confirmed:$published}')
          curl --fail-with-body --max-time 30 -sS -X POST "$WORKER_URL/alert-generation-failed" \
            -H "Authorization: Bearer $NOTIFY_SECRET" -H "Content-Type: application/json" -d "$payload"
